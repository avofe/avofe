name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: avofe
          outputs: github-snake-dark.svg?palette=github-dark

      - name: Verify SVG exists
        run: |
          ls -la github-snake-dark.svg
          wc -c github-snake-dark.svg

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B output
          git add -f github-snake-dark.svg
          git commit -m "Update snake" || echo "No changes to commit"
          git push -f origin output
